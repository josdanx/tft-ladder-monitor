name: TFT Ladder Monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tft-ladder-monitor
  cancel-in-progress: false

jobs:
  check-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Get latest code and saved rank
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check rank and send Discord alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py --once

      - name: Save rank for the next check
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if git diff --cached --quiet; then
            echo 'Rank and LP unchanged; no state commit needed.'
          else
            git commit -m 'Update saved TFT ladder position'
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
